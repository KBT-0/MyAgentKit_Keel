name: Kit acceptance

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # macOS 3.14 was cancelled at the old 30 minutes (run 39065623063) while Ubuntu took 14: a
    # limit that cuts a run short reads as a failure of the kit.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: bash 5.2 for the case lint (macOS ships 3.2; the image's Homebrew bash is relied on)
        if: runner.os == 'macOS'
        run: brew list bash >/dev/null 2>&1 || brew install bash
      - name: tr_TR.UTF-8 for the locale suites (macOS ships it; the Ubuntu image does not)
        if: runner.os == 'Linux'
        run: sudo locale-gen tr_TR.UTF-8
      - name: Run the full offline acceptance gate and negative tests
        run: ./scripts/check.sh --self-test

  # Native Windows: Git for Windows' sh with a python.org CPython, the host the gate lock, a
  # review run and the worktree clean-up are proven on. The kit check runs whole here: the
  # Windows suites print NOT RUN and pass elsewhere, so only this job proves them, and it runs
  # test_bootstrap, which a local Windows check leaves out for its twelve minutes. A case that
  # needs a POSIX host prints NOT RUN here; the jobs above prove it.
  windows:
    name: windows-latest / Python ${{ matrix.python }}
    runs-on: windows-latest
    # The same run took 59 of the old 60 minutes (3.14, serial tests); 90 keeps a green run from
    # being cut short until the kit check runs its units sharded.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the full offline acceptance gate and negative tests on native Windows
        shell: bash
        run: sh scripts/check.sh --self-test
