name: Kit acceptance

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each OS and Python runs the kit check's two tiers as parallel jobs (docs/research/
# kit-self-checks.md, findings 7 and 12): the fast tier, and the slow one (--slow: bootstrap,
# acceptance, the review bridge, worker-spawn and close_worker suites, locale test_git_hooks).
# A runner is slower than a developer host (finding 9), so the unit caps and tier targets run at
# three times their local seconds here. A unit cap is a hang guard (S5): a unit still running at
# it (fast 90 min, slow 270 min here) fails by name; a tier over its target only warns.
# timeout-minutes is GitHub's own hang guard above a normal run plus one unit's cap, so the cap
# names a hung unit first; the slow job sits at GitHub's 360-minute job maximum.
env:
  MYAGENTKIT_TEST_TIMEOUT_SCALE: '3'

jobs:
  acceptance:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.tier }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.tier == 'slow' && 360 || 150 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
        tier: [fast, slow]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # The tags: without a v* tag (depth 1 has none) the kit check's ACTION check is NOT RUN.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: bash 5.2 for the case lint (macOS ships 3.2; the image's Homebrew bash is relied on)
        if: runner.os == 'macOS'
        run: brew list bash >/dev/null 2>&1 || brew install bash
      - name: tr_TR.UTF-8 for the locale suites (macOS ships it; the Ubuntu image does not)
        if: runner.os == 'Linux'
        run: sudo locale-gen tr_TR.UTF-8
      - name: Run the kit check's ${{ matrix.tier }} tier (scripts/check_kit.py through its launcher)
        run: ./scripts/check.sh ${{ matrix.tier == 'slow' && '--slow' || '' }}

  # Native Windows: Git for Windows' sh with a python.org CPython, the host the gate lock, a
  # review run and the worktree clean-up are proven on. The Windows suites print NOT RUN and
  # pass elsewhere, so only these jobs prove them. A case that needs a POSIX host prints NOT RUN
  # here; the jobs above prove it.
  windows:
    name: windows-latest / Python ${{ matrix.python }} / ${{ matrix.tier }}
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.tier == 'slow' && 360 || 150 }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        tier: [fast, slow]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # The tags: without a v* tag (depth 1 has none) the kit check's ACTION check is NOT RUN.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the kit check's ${{ matrix.tier }} tier (scripts/check_kit.py through its launcher) on native Windows
        shell: bash
        run: sh scripts/check.sh ${{ matrix.tier == 'slow' && '--slow' || '' }}
